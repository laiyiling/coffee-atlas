af0;border:1px solid #d5c39f;box-shadow:var(--shadow);padding:clamp(20px,4vw,48px);position:relative;min-height:520px}.paper:before{content:'FIELD NOTE / COFFEE ATLAS';position:absolute;right:18px;top:12px;font-size:10px;letter-spacing:2px;color:#a99776}.paper h1{font-size:clamp(28px,4vw,42px);color:var(--green);line-height:1.2;margin:10px 0}.paper h2{font-size:18px;color:var(--accent);font-weight:normal}.paper p{white-space:pre-line;max-width:850px}.summary{background:#efe4ce;border-left:4px solid var(--accent);padding:14px 18px;margin:22px 0}.tag{display:inline-block;border:1px solid #cbb68e;padding:3px 9px;margin:3px;border-radius:20px;font-size:12px;color:#66543b}.refs{margin-top:32px;border-top:1px solid var(--line);padding-top:15px;font-size:13px}.refs a{color:#53694f;overflow-wrap:anywhere}.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.progress{height:4px;background:#d8c7a6}.progress span{display:block;height:4px;background:var(--accent);width:0}.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:22px}.bookcard{background:#f0e3c8;border:1px solid var(--line);padding:20px;cursor:pointer;min-height:150px}.bookcard b{display:block;color:var(--green);font-size:18px}.bookcard small{color:var(--muted)}.term{border-bottom:1px dotted var(--accent);cursor:pointer}.chapterVisual{margin:20px 0;padding:10px;background:#efe4ce;border:1px solid var(--line)}.chapterVisual img{display:block;width:100%;max-height:300px;object-fit:cover;cursor:zoom-in}.chapterVisual small{display:block;text-align:right;color:var(--muted);padding:5px}.lightbox{display:none;position:fixed;z-index:20;inset:0;background:#171a16ed;align-items:center;justify-content:center;padding:4vw;cursor:zoom-out}.lightbox.show{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain;border:8px solid #f5ead3;box-shadow:0 10px 40px #0008}.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:white;padding:10px 16px;display:none}.dark{--paper:#292d27;--paper2:#33382f;--ink:#e8ddc7;--green:#1f3027;--muted:#c4b18d;--line:#66583e}.dark .sidebar{background:#34392f}.dark .paper{background:#3b4036;border-color:#70634a}.dark .summary,.dark .bookcard,.dark .book{background:#4a4b3c}.dark .paper h1,.dark .book button{color:#e8ddc7}.dark .chaplist button{color:#e5d6b9}.dark .chaplist button.active{background:#5c5a43}.dark .hero{background:linear-gradient(90deg,#33382feF,#33382f99),url('assets/coffee_atlas_hero.svg') center/cover}.dark .search{background:#484a3c;color:#fff}.drawerToggle{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:none}.sidebar.show{display:block;position:fixed;z-index:5;inset:0 18% 0 0;overflow:auto;box-shadow:8px 0 30px #0005}.drawerToggle{display:inline-block}.top{flex-wrap:wrap}main{padding:15px}.hero{padding:25px}.tools{justify-content:flex-end}}

</style></head><body><div class="shell"><header class="top"><div class="brand">COFFEE ATLAS <small>THE RESEARCH NOTEBOOK · VOL. 01—05</small></div><div class="tools"><button class="drawerToggle" onclick="toggleDrawer()">☰ 目錄</button><input id="search" class="search" style="width:min(260px,48vw);margin:0" placeholder="搜尋咖啡知識／術語…"><button onclick="showFavorites()">★ 收藏</button><button onclick="toggleTheme()">◐ 閱讀模式</button><button onclick="changeFont(-1)">A−</button><button onclick="changeFont(1)">A＋</button><button onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 頂部</button></div></header><section class="hero"><div class="eyebrow">A FIELD GUIDE TO COFFEE</div><h1>咖啡研究手帳</h1><p>從咖啡植物、產地風土到烘焙、萃取與品飲。以可追溯資料為基礎，建立一套可以持續閱讀與擴充的咖啡知識筆記。</p><div><span class="tag">5 VOL.</span><span class="tag">11 CHAPTERS</span><span class="tag">15 SOURCES</span><span class="tag">APA 7TH</span></div></section><div class="progress"><span id="readProgress"></span></div><div class="layout"><aside class="sidebar" id="sidebar"><p class="sidehead">INDEX / NOTEBOOK</p><button class="btn" onclick="renderHome()" style="width:100%;margin-bottom:10px">⌂ 手帳首頁</button><div id="booknav"></div><button class="btn" onclick="showReferences()" style="width:100%;margin-top:14px">參考資料索引</button></aside><main><article class="paper" id="paper"><div class="eyebrow">WELCOME TO THE COFFEE ATLAS</div><h1>從一顆咖啡果實開始</h1><h2>Start with curiosity. Keep your notes.</h2><p>選擇左側五冊筆記，開始探索咖啡的世界。</p><div class="homegrid" id="homegrid"></div></article><div class="navrow"><button class="btn" id="prev" onclick="move(-1)">← 上一章</button><button class="btn" id="next" onclick="move(1)">下一章 →</button></div></main></div></div><div class="lightbox" id="lightbox" onclick="closeLightbox()"><img id="lightboxImage" alt="放大圖鑑"></div><div class="toast" id="toast"></div><script>
const books=[{"id": 1, "en": "The Foundations", "zh": "咖啡基礎", "chapters": ["01", "02"]}, {"id": 2, "en": "Origins & Terroir", "zh": "產地與風土", "chapters": ["03"]}, {"id": 3, "en": "Processing & Roasting", "zh": "加工與烘焙", "chapters": ["04", "05", "06"]}, {"id": 4, "en": "Tools & Brewing", "zh": "器材與沖煮", "chapters": ["07", "08", "09"]}, {"id": 5, "en": "Tasting & Living", "zh": "品飲與應用", "chapters": ["10", "11"]}], chapters=[{"id": "01", "book": 1, "en": "Coffee Origins & Culture", "zh": "咖啡的起源與文化", "summary": "從衣索比亞的植物起源、葉門的飲用傳統，到咖啡館成為城市公共生活的一部分。", "body": "咖啡樹的原生分布與歷史傳播，應分開理解。歷史資料通常將阿拉比卡咖啡的原生地指向衣索比亞；而作為烘焙、研磨後沖煮的飲品，咖啡在葉門及阿拉伯半島逐漸形成可辨識的飲用文化，再經鄂圖曼世界傳入歐洲。UC Davis Library 的展覽整理指出，咖啡在波斯文獻中的早期記載可追溯至十世紀，烘焙與研磨後沖煮的飲用方式約在十五世紀形成，十七世紀初傳入歐洲，後來咖啡館逐漸成為城市社交與知識交流空間。\n\n咖啡的全球化並非單一路線，而是由貿易、殖民、農業移植、港口物流與消費文化共同推動。咖啡館在不同地區承擔的角色也不同：它可能是商業談判場所、公共討論空間、工作場所，或日常休憩據點。今日的精品咖啡文化則進一步強調產地、品種、處理法、烘焙與沖煮透明度。\n\n**閱讀提醒：** Kaldi 等牧羊人傳說屬於文化傳說，不宜當作已被史料證實的單一發明事件。談咖啡歷史時，應區分口述傳說、文獻記載與可考的貿易史。 (University of California, Davis, Library, n.d.; International Trade Centre, 2021)", "sources": ["O1", "O5"]}, {"id": "02", "book": 1, "en": "The Coffee Plant & Varieties", "zh": "咖啡植物與品種", "summary": "認識咖啡樹、咖啡果實，以及商業栽培中最重要的阿拉比卡與羅布斯塔。", "body": "咖啡屬（Coffea）隸屬茜草科。商業市場最重要的兩個物種是阿拉比卡（Coffea arabica）與羅布斯塔／卡內弗拉（Coffea canephora）。兩者在遺傳背景、栽培適應性、抗病性與杯中表現上有差異，但不能簡化成「阿拉比卡一定好、羅布斯塔一定差」；品質仍受品種、環境、採收成熟度、後製、烘焙與沖煮共同影響。\n\n咖啡果實常被稱為咖啡櫻桃（coffee cherry）。果實由外果皮、果肉、果膠／黏液層、羊皮紙層、銀皮與種子等部分構成。一般商業咖啡豆主要是果實中的兩粒種子；偶爾只有一粒種子發育，常稱 peaberry。\n\nWorld Coffee Research 的品種目錄收錄多個國家的阿拉比卡與羅布斯塔栽培品種，並整理產量潛力、適生海拔、病蟲害抗性等農藝資訊。品種名稱（如 Typica、Bourbon、Caturra、Geisha、SL28）代表不同遺傳或選育脈絡，不應直接視為風味保證。 (World Coffee Research, n.d.; International Trade Centre, 2021)", "sources": ["O2", "O5", "A7"]}, {"id": "03", "book": 2, "en": "Coffee Origins & Terroir", "zh": "世界咖啡產地", "summary": "以咖啡帶為起點，理解非洲、中南美洲與亞洲產區的地理、氣候與文化差異。", "body": "咖啡主要生長於赤道兩側的熱帶與亞熱帶高地，常以「咖啡帶」（Coffee Belt）概括其地理範圍。實際適生條件會因物種、品種、海拔、緯度、降雨季節性、土壤、遮蔭與農業管理而異，因此不能把單一海拔數字當成全球通用標準。\n\n非洲產區常見衣索比亞、肯亞、烏干達等。衣索比亞具有豐富的地方遺傳資源與多樣化產區；肯亞常以分級、拍賣制度與水洗處理聞名。中南美洲的重要產國包括巴西、哥倫比亞、宏都拉斯、瓜地馬拉與哥斯大黎加；巴西產量規模大，哥倫比亞則有多樣山區產區。亞洲產區包括越南、印尼、印度與台灣等，物種比例、農法及處理傳統各不相同。\n\n產地風味描述應視為常見感官印象，而不是每一批豆子的保證。單一產地咖啡（single origin）也可能來自國家、產區、合作社或單一農場，標示範圍需看包裝定義。查詢產量與貿易量時，應優先使用 ICO 統計或 ITC 指南，並標示統計年度；產量排名會隨年度與資料口徑變動。 (International Coffee Organization, n.d.; International Trade Centre, 2021; National Coffee Association, n.d.)", "sources": ["O3", "O5", "I1"]}, {"id": "04", "book": 3, "en": "Post-harvest Processing", "zh": "咖啡豆處理法", "summary": "採收後如何去除果皮、果肉與黏液層，會影響發酵、乾燥與後續風味形成。", "body": "處理法是咖啡果實採收後轉成生豆的關鍵階段。常見路徑包括日曬／乾式處理（natural）、水洗／濕式處理（washed）與蜜處理／半乾式處理（honey or pulped natural）。\n\n日曬通常將完整咖啡果實乾燥，果皮、果肉與黏液層在乾燥期間仍包覆種子；此法需要控制翻動、層厚、通風與乾燥速度。水洗通常先去除果皮果肉，再透過發酵或機械方式去除黏液層並清洗，之後乾燥。蜜處理通常先去除果皮果肉，保留部分黏液層乾燥；不同地區的「蜜處理」命名與分級方式可能不同。\n\n研究指出，不同處理方法會改變咖啡的揮發性與非揮發性成分，並可能影響香氣與感官表現；但風味結果仍受到品種、成熟度、微生物、乾燥管理、儲存、烘焙等因素交互影響。不要把「日曬必然甜」「水洗必然酸」當作絕對規則。 (Várady et al., 2022; Cao et al., 2023; Shen et al., 2023)", "sources": ["A1", "A2", "A3", "O5"]}, {"id": "05", "book": 3, "en": "Coffee Roasting", "zh": "咖啡烘焙", "summary": "烘焙透過熱反應改變生豆顏色、結構與香氣，形成可沖煮的熟豆。", "body": "烘焙是將生豆加熱，使其含水量、密度、孔隙、顏色與化學組成產生變化的過程。熱量傳遞、豆量、設備、環境溫度、時間與升溫曲線都會影響結果。烘焙過程涉及梅納反應、焦糖化、熱裂解及其他複雜反應，形成多種揮發性香氣物質。\n\n淺焙、中焙、深焙是常見的描述分類，但業界沒有一條適用所有烘豆機與所有豆種的絕對分界。顏色、失重率、發展時間與杯中感官表現可共同參考。淺焙常保留較多原料與產地差異；較深烘焙通常呈現更明顯的烘烤、焦糖、苦甜或煙燻印象，但不能僅憑顏色判斷萃取或品質。\n\n2025 年研究分析烘焙過程中的揮發物與感官變化，指出不同化合物與感官屬性之間存在關聯；另一研究指出烘焙程度會影響非揮發物與揮發物組成。這些結果說明烘焙是化學與感官共同變化的過程，不應只用「深淺」二分。 (Cao et al., 2023; Debona et al., 2025; Alcantara et al., 2025)", "sources": ["A2", "A5", "A6"]}, {"id": "06", "book": 3, "en": "Coffee Flavor & Aroma", "zh": "咖啡風味", "summary": "風味由味覺、嗅覺與口腔觸感共同構成；描述詞是溝通工具，不是添加物清單。", "body": "咖啡風味（flavor）通常包含味覺、嗅覺與口腔感受的整合。酸質（acidity）是感官描述之一，不等於品質缺陷；苦味（bitterness）、甜感（sweetness）、醇厚度（body）、餘韻（aftertaste）與平衡感（balance）也會共同影響整體印象。\n\n香氣描述詞如柑橘、莓果、花香、堅果、巧克力或香料，通常是在比喻感官聯想，不代表咖啡真的加入了這些食材。風味形成受到品種、產地環境、成熟度、處理法、烘焙與沖煮共同影響。\n\nSCA 與 World Coffee Research 合作發展的 Coffee Taster’s Flavor Wheel，建議從中心較廣泛的類別開始，再往外圈尋找更具體描述。它與 Sensory Lexicon 搭配使用，可協助品飲者建立較一致的描述語言。風味輪是分類與溝通工具，不是評分表，也不代表每杯咖啡都必須找出多個風味詞。 (Specialty Coffee Association, n.d.; Carvalho et al., 2025; Ayseli, 2025)", "sources": ["O4", "A7", "A8"]}, {"id": "07", "book": 4, "en": "Coffee Equipment", "zh": "咖啡器材", "summary": "磨豆機、濾杯、濾紙、手沖壺、電子秤與義式設備各自影響沖煮控制。", "body": "器材選擇應配合沖煮方式與使用者需求。磨豆機負責將咖啡豆研磨成顆粒；研磨均勻度與粒徑分布會影響水流通過粉層的速度與萃取。濾杯形狀、濾孔、濾紙材質與注水方式也會影響流速與杯中表現。\n\n手沖常見器材包括濾杯、濾紙、分享壺、細口壺、電子秤與計時器。義式咖啡則通常使用具備加壓萃取能力的咖啡機與適合細研磨的磨豆機。法式濾壓壺以浸泡方式萃取，摩卡壺則利用加熱產生的蒸氣壓力推動熱水通過咖啡粉；不同器材不能直接用同一組參數互換。\n\n器材本身不是風味保證。咖啡粉量、水量、研磨、溫度、時間、水質與操作方式需要一起考慮。選購時先確定常用沖煮方式，再考量清潔、耐用、零件供應與預算。 (Cordoba Castro et al., 2020; Specialty Coffee Association, n.d.; International Trade Centre, 2021)", "sources": ["A4", "I2", "O5"]}, {"id": "08", "book": 4, "en": "Pour-over Brewing", "zh": "手沖咖啡", "summary": "手沖是以重力讓熱水通過咖啡粉層的沖煮方式，需管理粉水比、研磨、水溫與注水。", "body": "手沖咖啡（pour-over）通常使用濾杯與濾紙，熱水由上而下穿過咖啡粉層，萃取可溶性物質後流入下壺或杯中。常見流程為：準備器材與水、沖洗濾紙、研磨咖啡、加入咖啡粉、悶蒸、分段注水、等待滴濾完成並攪拌或搖勻。\n\n初學者可先固定粉水比、研磨刻度與水溫，再一次只調整一個變因。粉水比是咖啡粉重量與總注水重量的比例，例如 15 g 咖啡粉搭配 240 g 水，比例為 1:16。這是教學起點，不是唯一標準。若風味過淡或偏水，可檢查研磨、水粉接觸與粉水比；若過度苦澀或乾澀，則檢查研磨、時間、水溫與注水是否造成過度萃取或通道效應。\n\n萃取研究指出，溫度、壓力、粒徑與水質等參數都會影響咖啡液的物理化學特徵與風味。建議記錄每次沖煮參數，透過小幅調整建立自己的穩定配方。 (Cordoba Castro et al., 2020; International Trade Centre, 2021; Specialty Coffee Association, n.d.)", "sources": ["A4", "O5", "I2"]}, {"id": "09", "book": 4, "en": "Espresso & Milk Drinks", "zh": "義式咖啡", "summary": "Espresso 是以加壓熱水快速通過細研磨咖啡粉形成的濃縮咖啡基底。", "body": "義式濃縮咖啡（espresso）以加壓熱水通過細研磨、填壓的咖啡粉餅，形成濃度較高的咖啡液。萃取品質受粉量、出液量、研磨、填壓、溫度、壓力、時間與咖啡豆狀態影響。常見參數需依豆子與機器調整，不能把單一配方當成所有義式咖啡的標準。\n\n常見奶咖包括拿鐵（caffè latte）、卡布奇諾（cappuccino）與 Flat White。它們的差異涉及濃縮咖啡比例、牛奶量、奶泡質地與杯量；不同國家、咖啡館與競賽規範可能存在配方差異。\n\nCrema 是濃縮咖啡表面形成的泡沫層，與咖啡豆新鮮度、烘焙、氣體、萃取條件等有關，但 crema 厚度本身不能單獨代表 espresso 的品質。 (Cordoba Castro et al., 2020; Specialty Coffee Association, n.d.; International Trade Centre, 2021)", "sources": ["A4", "I2", "O5"]}, {"id": "10", "book": 5, "en": "Tasting & Choosing Beans", "zh": "咖啡品飲與選豆", "summary": "用有順序的觀察與品飲紀錄，將個人喜好轉化成可溝通的選豆條件。", "body": "品飲可從乾香、濕香、入口風味、酸甜苦、醇厚度、餘韻與整體平衡等面向記錄。先描述觀察到的感受，再嘗試用風味輪找出更具體的詞彙；不要急著把個人偏好等同於客觀品質。SCA 的風味輪建議從中心類別往外圈逐步細化，並透過感官參考物建立詞彙對照。\n\n選豆時先看烘焙日期、產地、品種、處理法、烘焙程度與包裝資訊。若包裝標示莊園、合作社、海拔、批次、採收年度或處理細節，可作為追溯線索；但不同品牌標示完整程度不一，缺少某項資訊不必然代表品質差。\n\n新手選豆可從喜歡的飲用方式開始：偏好黑咖啡可先比較不同產區與處理法；常喝奶咖則可尋找在牛奶中仍有清晰甜感或可可、堅果調性的配方。購買少量、記錄沖煮參數與喜好，比追逐高價或熱門產區更有助於找到適合自己的咖啡。 (Specialty Coffee Association, n.d.; International Trade Centre, 2021; Ayseli, 2025)", "sources": ["O4", "O5", "A8"]}, {"id": "11", "book": 5, "en": "Coffee & Food Pairing", "zh": "咖啡與甜點／餐食搭配", "summary": "搭配時可考慮強度、風味相似、風味對比與口感重量，並以個人試飲為準。", "body": "咖啡與食物搭配可從四個方向思考：相似風味呼應、對比風味平衡、強度相稱，以及口感互補。帶有可可或堅果聯想的咖啡，常可與巧克力、堅果甜點搭配；果香明顯的咖啡可嘗試莓果塔或柑橘甜點；較厚重的深焙咖啡可能適合奶油、焦糖或烘烤風味較強的甜點。這些是搭配假設，不是固定規則。\n\n品飲時可先單獨喝一口咖啡，再吃一小口食物，最後一起品嘗，觀察香氣、甜感、酸度與餘韻是否互相加強或互相遮蓋。避免讓甜點過甜或香氣過強，完全蓋過咖啡本身。\n\n咖啡因含量、酸度與個人飲食需求也需納入考量。若對咖啡因敏感，可選擇低咖啡因或無咖啡因產品；搭配的核心不是追求昂貴食材，而是讓兩者的風味都有被感受到。 (International Trade Centre, 2021; Specialty Coffee Association, n.d.)", "sources": ["O5", "O4", "I1"]}], sources=[{"id": "A1", "type": "學術研究", "authors": "Várady, M., Tauchen, J., Fraňková, A., Klouček, P., & Popelka, P.", "year": "2022", "title": "Effect of method of processing specialty coffee beans (natural, washed, honey, fermentation, maceration) on bioactive and volatile compounds", "publication": "LWT, 172, 114245", "doi": "https://doi.org/10.1016/j.lwt.2022.114245", "use": "處理法、揮發性與生物活性成分"}, {"id": "A2", "type": "學術研究", "authors": "Cao, X., Wu, H., Viejo, C. G., Dunshea, F. R., & Suleria, H. A. R.", "year": "2023", "title": "Effects of postharvest processing on aroma formation in roasted coffee – a review", "publication": "International Journal of Food Science & Technology, 58(3), 1007–1027", "doi": "https://doi.org/10.1111/ijfs.16261", "use": "處理、香氣形成與烘焙化學"}, {"id": "A3", "type": "學術研究", "authors": "Shen, X., Zi, C., Yang, Y., Wang, Q., Zhang, Z., Shao, J., Zhao, P., Liu, K., Li, X., & Fan, J.", "year": "2023", "title": "Effects of Different Primary Processing Methods on the Flavor of Coffea arabica Beans by Metabolomics", "publication": "Fermentation, 9(8), 717", "doi": "https://doi.org/10.3390/fermentation9080717", "use": "水洗、日曬、蜜處理與風味代謝物"}, {"id": "A4", "type": "學術研究", "authors": "Cordoba Castro, N. M., Fernandez Alduenda, M. R., Moreno Moreno, F. L., & Ruiz Pardo, R. Y.", "year": "2020", "title": "Coffee extraction: A review of parameters and their influence on the physicochemical characteristics and flavour of coffee brews", "publication": "Trends in Food Science & Technology, 96, 45–60", "doi": "https://doi.org/10.1016/j.tifs.2019.12.004", "use": "萃取、研磨、水溫、壓力與沖煮變因"}, {"id": "A5", "type": "學術研究", "authors": "Debona, D. G., Lyrio, M. V. V., da Luz, J. M. R., Frinhani, R. Q., Araújo, B. Q., Oliveira, E. C. S., Agnoletti, B. Z., Coura, M. R., Pereira, L. L., & de Castro, E. V. R.", "year": "2025", "title": "Comprehensive evaluation of volatile compounds and sensory profiles of coffee throughout the roasting process", "publication": "Food Chemistry, 478, 143586", "doi": "https://doi.org/10.1016/j.foodchem.2025.143586", "use": "烘焙過程、揮發物與感官特徵"}, {"id": "A6", "type": "學術研究", "authors": "Alcantara, G. M. R. N., Martins, L. C., Gomes, W. P. C., Dresch, D., Rocha, F. R. P., & Melchert, W. R.", "year": "2025", "title": "Effect of roasting on chemical composition of coffee", "publication": "Food Chemistry, 477, 143169", "doi": "https://doi.org/10.1016/j.foodchem.2025.143169", "use": "烘焙程度與化學組成變化"}, {"id": "A7", "type": "學術研究", "authors": "Carvalho, F. M., Alves, E. A., Artêncio, M. M., Cassago, A. L. L., & Pereira, L. L.", "year": "2025", "title": "Development of a flavour wheel for Coffea canephora using rate-all-that-apply", "publication": "Scientific Reports, 15, Article 16643", "doi": "https://doi.org/10.1038/s41598-025-99921-w", "use": "羅布斯塔風味描述與品飲"}, {"id": "A8", "type": "學術研究", "authors": "Ayseli, M. T.", "year": "2025", "title": "The role of volatile and non-volatile compounds as quality indicators and marker candidates in coffee: A systematic review", "publication": "Journal of Food Composition and Analysis, 137, 106846", "doi": "https://doi.org/10.1016/j.jfca.2024.106846", "use": "咖啡品質、香氣與化學指標"}, {"id": "O1", "type": "官方／研究機構", "authors": "University of California, Davis, Library.", "year": "n.d.", "title": "Brewed Awakening: The Evolution of the Coffee Industry", "publication": "UC Davis Library, Archives and Special Collections", "doi": "https://library.ucdavis.edu/exhibit/brewed-awakening/", "use": "咖啡起源與全球傳播史"}, {"id": "O2", "type": "官方／研究機構", "authors": "World Coffee Research.", "year": "n.d.", "title": "Coffee varieties catalog", "publication": "World Coffee Research", "doi": "https://worldcoffeeresearch.org/resources/coffee-varieties-catalog", "use": "阿拉比卡與羅布斯塔品種資料"}, {"id": "O3", "type": "官方／國際組織", "authors": "International Coffee Organization.", "year": "n.d.", "title": "World Coffee Statistics Database", "publication": "International Coffee Organization", "doi": "https://ico.org/what-we-do/world-coffee-statistics-database/", "use": "生產、消費、貿易與價格統計；部分資料需訂閱"}, {"id": "O4", "type": "官方／專業組織", "authors": "Specialty Coffee Association.", "year": "n.d.", "title": "How to Use the Coffee Taster’s Flavor Wheel in Eight Steps", "publication": "Specialty Coffee Association", "doi": "https://sca.coffee/sca-news/how-to-use-the-flavor-wheel-in-eight-steps-ab2hy", "use": "風味輪閱讀與品飲描述"}, {"id": "O5", "type": "官方／國際組織", "authors": "International Trade Centre.", "year": "2021", "title": "The Coffee Guide (4th ed.)", "publication": "International Trade Centre, Geneva", "doi": "https://www.intracen.org/sites/default/files/uploadedFiles/intracenorg/Content/Publications/ITC_Coffee_4th_Report_20210930_web_pages.pdf", "use": "咖啡價值鏈、產地、品質與後製概覽"}, {"id": "I1", "type": "專業產業資料", "authors": "National Coffee Association.", "year": "n.d.", "title": "Coffee regions of the world", "publication": "NCA About Coffee", "doi": "https://www.aboutcoffee.org/origins/coffee-regions-of-the-world/", "use": "咖啡帶、產區與產地概覽"}, {"id": "I2", "type": "專業產業資料", "authors": "Specialty Coffee Association.", "year": "n.d.", "title": "Coffee Standards", "publication": "Specialty Coffee Association", "doi": "https://sca.coffee/research/coffee-standards", "use": "杯測、設備、沖煮與專業標準導覽"}];let current=-1,font=17,all=[...chapters];
function el(id){return document.getElementById(id)}function toast(t){el('toast').textContent=t;el('toast').style.display='block';setTimeout(()=>el('toast').style.display='none',1800)}
function toggleDrawer(){el('sidebar').classList.toggle('show')}function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('coffeeTheme',document.body.classList.contains('dark')?'dark':'light')}
function changeFont(d){font=Math.max(14,Math.min(22,font+d));el('paper').style.fontSize=font+'px'}
function buildNav(){el('booknav').innerHTML=books.map(b=>`<div class="book" id="book${b.id}"><button onclick="toggleBook(${b.id})">▸ VOL. 0${b.id}｜${b.zh}<small style="display:block;font-weight:normal;color:#87765a">${b.en}</small></button><div class="chaplist">${b.chapters.map(id=>{let c=chapters.find(x=>x.id===id);return `<button id="ch${id}" onclick="openChapter('${id}')">${id} ${c.zh}</button>`}).join('')}</div></div>`).join('')}
function toggleBook(id){el('book'+id).classList.toggle('open')}
function renderHome(){current=-1;el('paper').innerHTML=`<div class="eyebrow">WELCOME TO THE COFFEE ATLAS</div><h1>從一顆咖啡果實開始</h1><h2>Start with curiosity. Keep your notes.</h2><p>本知識庫分為五冊。每冊聚焦一段從植物到杯中的旅程，章節內含重點摘要、知識說明與可追溯參考資料。</p><div class="homegrid">${books.map(b=>`<div class="bookcard" onclick="toggleBook(${b.id});openChapter('${b.chapters[0]}')"><small>VOL. 0${b.id}</small><b>${b.zh}</b><span>${b.en}</span><p>${b.chapters.length} 個章節</p></div>`).join('')}</div>`;el('prev').disabled=true;el('next').disabled=false;el('readProgress').style.width='0%';}
function visualFor(id){if(id==='04')return 'assets/processing_methods.svg';if(id==='06')return 'assets/flavor_wheel.svg';if(id==='08')return 'assets/brewing_steps.svg';return 'assets/coffee_atlas_hero.svg'}function openLightbox(src){el('lightboxImage').src=src;el('lightbox').classList.add('show')}function closeLightbox(){el('lightbox').classList.remove('show')}function openChapter(id){current=chapters.findIndex(c=>c.id===id);let c=chapters[current];let b=books.find(x=>x.id===c.book);document.querySelectorAll('.chaplist button').forEach(x=>x.classList.remove('active'));el('ch'+id)?.classList.add('active');el('book'+c.book)?.classList.add('open');el('paper').innerHTML=`<div class="eyebrow">VOL. 0${b.id} / ${b.en.toUpperCase()}</div><h2>${c.en}</h2><h1>${c.zh}</h1><div class="summary"><b>本章摘要</b><br>${c.summary}</div><div class="chapterVisual"><img src="${visualFor(c.id)}" alt="${c.zh}圖鑑" onclick="openLightbox(this.src)"><small>點擊圖片放大｜Illustrated field note</small></div><p>${c.body}</p><div class="refs"><b>本章參考資料 / REFERENCES</b><ul>${c.sources.map(sid=>{let s=sources.find(x=>x.id===sid);return `<li>${s.authors} (${s.year}). <i>${s.title}</i>. ${s.publication}. <a href="${s.doi}" target="_blank" rel="noopener">${s.doi}</a></li>`}).join('')}</ul></div><div style="margin-top:18px"><span class="tag">${c.id}</span><span class="tag">${b.zh}</span><button class="btn" onclick="copyText('${c.zh.replaceAll("'","\\'")}: ${c.summary.replaceAll("'","\\'")}')">複製術語／摘要</button><button class="btn" onclick="favorite('${c.id}')">☆ 收藏本章</button><button class="btn" onclick="window.print()">列印本章</button></div><div class="summary"><b>延伸閱讀</b><br>${chapters.filter(x=>x.id!==c.id&&(x.book===c.book||x.sources.some(s=>c.sources.includes(s)))).slice(0,3).map(x=>`<a href="#${x.id}" onclick="openChapter('${x.id}');return false">${x.zh}</a>`).join(' · ')}</div>`;el('prev').disabled=current===0;el('next').disabled=current===chapters.length-1;el('readProgress').style.width=((current+1)/chapters.length*100)+'%';if(innerWidth<800)el('sidebar').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'});}
function move(d){if(current<0){openChapter(chapters[0].id);return}let n=Math.max(0,Math.min(chapters.length-1,current+d));openChapter(chapters[n].id)}function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('已複製')).catch(()=>toast('請手動複製'))}
function favorite(id){let a=JSON.parse(localStorage.getItem('coffeeFav')||'[]');if(a.includes(id))a=a.filter(x=>x!==id);else a.push(id);localStorage.setItem('coffeeFav',JSON.stringify(a));toast(a.includes(id)?'已加入收藏':'已取消收藏')}
function showFavorites(){let a=JSON.parse(localStorage.getItem('coffeeFav')||'[]');el('paper').innerHTML='<div class="eyebrow">YOUR SAVED NOTES</div><h1>收藏筆記</h1>'+(a.length?a.map(id=>{let c=chapters.find(x=>x.id===id);return `<p><a href="#" onclick="openChapter('${id}');return false">${c.id}｜${c.zh}</a></p>`}).join(''):'<p>目前尚無收藏。</p>')}
function showReferences(){el('paper').innerHTML='<div class="eyebrow">SOURCE REGISTER</div><h1>資料來源索引</h1><p>本知識庫使用 15 筆來源：8 篇學術研究、5 筆官方／研究機構資料、2 筆專業產業資料。點擊 DOI 或原始網址可查閱原始資料。</p>'+sources.map(s=>`<div class="summary"><b>${s.id}｜${s.type}</b><br>${s.authors} (${s.year}). <i>${s.title}</i>. ${s.publication}<br><a href="${s.doi}" target="_blank" rel="noopener">${s.doi}</a><br><small>${s.use}</small></div>`).join('')}
function search(q){q=q.trim().toLowerCase();if(!q)return;let matches=chapters.filter(c=>(c.zh+c.en+c.body+c.summary).toLowerCase().includes(q));let safe=q.replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));el('paper').innerHTML=`<div class="eyebrow">SEARCH RESULTS</div><h1>搜尋結果：${safe}</h1>`+(matches.length?matches.map(c=>`<div class="summary"><a href="#" onclick="openChapter('${c.id}');return false"><b>${c.id}｜${c.zh}</b></a><br>${c.summary}</div>`).join(''):'<p>找不到符合的章節，請嘗試其他關鍵字。')}
el('search').addEventListener('keydown',e=>{if(e.key==='Enter')search(e.target.value)});if(localStorage.getItem('coffeeTheme')==='dark')document.body.classList.add('dark');buildNav();renderHome();window.addEventListener('scroll',()=>{let h=document.documentElement.scrollHeight-innerHeight;el('readProgress').style.width=(h>0?scrollY/h*100:0)+'%'})
</script></body></html>
