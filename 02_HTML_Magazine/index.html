<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE COFFEE ATLAS｜Magazine</title><style>
:root{--paper:#ead9b7;--cream:#f7efdd;--ink:#2c2b22;--green:#304638;--rust:#a75f37;--gold:#b68b51}*{box-sizing:border-box}body{margin:0;background:#2c3028;color:var(--ink);font-family:Georgia,'Noto Serif TC',serif;overflow:hidden}.mag{height:100vh;display:grid;grid-template-columns:1fr 78px}.viewport{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none}.viewport::-webkit-scrollbar{display:none}.page{height:100vh;min-height:600px;scroll-snap-align:start;position:relative;overflow:hidden;background:var(--paper);display:grid;grid-template-columns:1fr 1fr;padding:clamp(26px,5vw,72px);gap:4vw}.page:nth-child(odd){background:#f1e5cb}.page:after{content:attr(data-page);position:absolute;bottom:18px;right:28px;font-size:12px;letter-spacing:3px;color:#8c7959}.left{display:flex;flex-direction:column;justify-content:center;z-index:1}.kicker{font-size:11px;letter-spacing:4px;color:var(--rust);text-transform:uppercase}.page h1{font-size:clamp(32px,5vw,66px);line-height:1.02;color:var(--green);margin:12px 0 18px}.page h2{font-size:clamp(18px,2vw,25px);font-weight:normal;color:#775a3d;margin:0 0 18px}.page p{font-family:'Noto Serif TC',Georgia,serif;font-size:clamp(15px,1.35vw,19px);line-height:1.9;max-width:650px}.right{display:flex;align-items:center;justify-content:center;position:relative}.art{width:100%;height:min(72vh,650px);background:linear-gradient(140deg,#6c7354,#c3a477);border:12px solid #e2d0ad;box-shadow:12px 16px 0 #8d6e4730;position:relative;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover;filter:sepia(.18) saturate(.8)}.art:after{content:'';position:absolute;inset:0;background:linear-gradient(145deg,#31433322,#a65d2733);pointer-events:none}.plate{position:absolute;left:10%;bottom:10%;padding:14px 18px;background:#f6ecd7dd;border:1px solid #a68c60;max-width:80%;z-index:2}.plate b{display:block;color:var(--green);font-size:18px}.plate small{color:#715b3c;letter-spacing:1px}.cover{display:flex;align-items:center;justify-content:center;grid-template-columns:1fr;background:linear-gradient(90deg,#f2e5ccdc,#f2e5cc44),url('../01_Wiki/assets/coffee_atlas_hero.svg') center/cover}.cover .left{max-width:720px}.cover h1{font-size:clamp(54px,9vw,120px);letter-spacing:-3px}.cover .right{display:none}.cover .subtitle{font-size:20px;letter-spacing:5px;color:#9b603a}.toc .left{grid-column:1/-1}.toc .right{display:none}.toclist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.tocitem{border-top:1px solid #ad966c;padding:10px 4px}.tocitem b{display:block;color:var(--green)}.wheel{width:min(70%,430px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#b56b4d 0 45deg,#d1a35f 45deg 90deg,#87956a 90deg 135deg,#4f725e 135deg 180deg,#c6a36e 180deg 225deg,#9b6e50 225deg 270deg,#b5a37c 270deg 315deg,#6c8064 315deg);border:18px solid #f4e7cb;box-shadow:0 10px 24px #533e2540;display:grid;place-items:center}.wheel span{width:43%;height:43%;background:#f3e8d1;border-radius:50%;display:grid;place-items:center;text-align:center;color:#304638;font-size:18px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}.step{background:#e2d0ae;padding:14px;border:1px solid #bca77e;min-height:115px}.step b{display:block;color:var(--rust);font-size:22px}.tabs{height:100vh;background:#303c31;display:flex;flex-direction:column;align-items:center;padding:14px 6px;gap:5px;overflow:auto}.tabs .brand{writing-mode:vertical-rl;color:#e7d6b5;letter-spacing:3px;font-size:11px;margin:6px 0 12px}.tab{width:58px;min-height:38px;border:0;background:#d8c49c;color:#344337;cursor:pointer;font:12px Georgia;border-radius:4px 0 0 4px;box-shadow:inset -3px 0 #8c6b43}.tab.active{background:#f7ebd1;transform:translateX(-5px);font-weight:bold}.tab small{display:block;font-size:9px}.controls{position:fixed;left:18px;bottom:18px;z-index:5;display:flex;gap:8px}.controls button{background:#304638;color:#f7edda;border:1px solid #c5a56f;padding:9px 12px;cursor:pointer}.counter{position:fixed;top:15px;left:20px;z-index:4;color:#6f593c;background:#f3e7cfcc;padding:5px 9px;font-size:12px;letter-spacing:2px}.progress{position:fixed;top:0;left:0;height:4px;background:#b97848;width:0;z-index:8}.page .ornament{position:absolute;left:24px;top:18px;color:#a88e63;font-size:10px;letter-spacing:3px}.mapdots{width:100%;height:70%;background:radial-gradient(ellipse at 50% 50%,#b7a47a 0 1px,transparent 2px),radial-gradient(ellipse at 30% 36%,#7b8b68 0 6%,transparent 6.5%),radial-gradient(ellipse at 65% 55%,#7b8b68 0 8%,transparent 8.5%),radial-gradient(ellipse at 48% 72%,#7b8b68 0 5%,transparent 5.5%),#e4d2ad;border:1px solid #b69c6e;position:relative}.mapdots:before{content:'COFFEE BELT';position:absolute;top:50%;left:0;right:0;border-top:2px dashed #a65f3b;text-align:center;color:#a65f3b;letter-spacing:4px;font-size:12px}.footer{position:absolute;bottom:22px;left:clamp(26px,5vw,72px);font-size:10px;letter-spacing:2px;color:#927d5c}
@media(max-width:760px){.mag{grid-template-columns:1fr 54px}.page{grid-template-columns:1fr;padding:42px 22px 65px;gap:10px}.right{height:32vh}.art{height:30vh}.page p{font-size:15px}.page h1{font-size:38px}.toclist{grid-template-columns:repeat(2,1fr)}.tab{width:43px}.tabs{padding:8px 4px}.controls{bottom:8px;left:8px}.controls button{padding:7px 9px;font-size:11px}}
</style></head><body><div class="progress" id="progress"></div><div class="counter" id="counter">01 / 32</div><div class="mag"><main class="viewport" id="viewport"></main><nav class="tabs" id="tabs"><div class="brand">THE COFFEE ATLAS</div></nav></div><div class="controls"><button onclick="prev()">← 上一頁</button><button onclick="next()">下一頁 →</button><button onclick="toggleFull()">全螢幕</button></div><script>
const slides=[["THE COFFEE ATLAS", "咖啡世界圖鑑", "A visual journey from origin to cup.", "封面｜以復古研究手帳視角，展開一趟從咖啡樹到杯中的旅程。", "cover"], ["FIELD NOTES / CONTENTS", "目錄", "Six chapters · Thirty pages", "從咖啡的世界、產地、加工、風味、沖煮到日常品飲。", "toc"], ["ORIGIN STORY", "咖啡從哪裡開始？", "Ethiopia · Yemen · The wider world", "歷史研究多將阿拉比卡原生地指向衣索比亞；作為烘焙研磨飲品的咖啡文化，則在葉門與阿拉伯半島逐漸成形。傳說與史料要分開閱讀。", "history"], ["COFFEEHOUSE CULTURE", "咖啡館與城市生活", "A place to meet, think, and trade", "咖啡館在不同時代成為社交、商業與公共討論的場所。咖啡的全球傳播與貿易、殖民、農業移植和城市消費文化密切相關。", "culture"], ["BOTANICAL NOTES", "咖啡植物的構造", "From blossom to cherry", "咖啡屬於茜草科。果實常稱咖啡櫻桃，內含種子；果皮、果肉、黏液層、羊皮紙層與銀皮會在後製過程中被不同程度處理。", "plant"], ["COFFEE CHERRY ANATOMY", "咖啡果實解剖", "Layers between skin and seed", "咖啡果實由外果皮、果肉、黏液層、羊皮紙層、銀皮與種子等部分構成；不同處理法會以不同方式去除或保留這些層次。", "cherry"], ["SPECIES & VARIETIES", "阿拉比卡與羅布斯塔", "Two major cultivated species", "阿拉比卡與羅布斯塔是商業栽培最重要的兩個物種。品種、環境、採收與後製都會影響品質；不能只靠物種名稱判斷杯中好壞。", "species"], ["THE COFFEE BELT", "世界咖啡帶", "Tropical origins around the equator", "咖啡主要產區位於赤道兩側的熱帶與亞熱帶。緯度、海拔、溫度、雨季、土壤與遮蔭會共同影響栽培條件。", "belt"], ["AFRICA / ORIGIN NOTES", "非洲產區", "Ethiopia · Kenya · Uganda", "衣索比亞具有豐富的地方遺傳資源；肯亞以產區制度與水洗咖啡聞名；烏干達同時具有阿拉比卡與羅布斯塔生產。風味標籤是常見描述，不是每批豆子的保證。", "africa"], ["CENTRAL & SOUTH AMERICA", "中南美洲產區", "Brazil · Colombia · Central America", "巴西是全球重要的咖啡生產國；哥倫比亞具有多樣山區產區。宏都拉斯、瓜地馬拉、哥斯大黎加等國也形成各自的生產與處理傳統。", "america"], ["ASIA / ORIGIN NOTES", "亞洲咖啡產區", "Vietnam · Indonesia · India · Taiwan", "亞洲產區涵蓋不同物種比例、農法與處理方式。越南是重要羅布斯塔產國，印尼有多樣島嶼產區；比較產量時要註明統計年度。", "asia"], ["POST-HARVEST", "從咖啡果實到生豆", "Processing changes the green bean", "採收後處理會去除果皮、果肉與黏液層，並透過發酵、清洗與乾燥穩定生豆。乾燥管理對品質與儲存安全十分重要。", "process"], ["WASHED / NATURAL / HONEY", "三種常見處理法", "Different paths, not fixed flavor promises", "日曬保留整顆果實乾燥；水洗先去除果皮果肉並清除黏液層；蜜處理去皮後保留部分黏液層乾燥。風味會受微生物、乾燥與其他變因共同影響。", "methods"], ["ROASTING TRANSFORMATION", "烘焙如何改變咖啡？", "Heat · Time · Chemistry", "烘焙使生豆水分、顏色、孔隙與化學組成改變。梅納反應、焦糖化與熱裂解等反應參與香氣形成。", "roast"], ["ROAST LEVELS", "淺焙、中焙、深焙", "A spectrum, not a universal ruler", "烘焙程度是連續變化，業界分類沒有單一全球分界。可參考豆色、失重、烘焙曲線與杯中感官，而不只看顏色。", "levels"], ["BUILDING FLAVOR", "風味如何形成？", "Variety × Place × Process × Roast × Brew", "咖啡風味不是單一因素決定。品種、環境、成熟度、處理、烘焙與沖煮共同影響味覺、嗅覺與口腔觸感。", "flavor"], ["THE FLAVOR WHEEL", "咖啡風味輪", "Start at the center, move outward", "風味輪由中心較廣泛的類別往外圈逐步細化。先描述花香、果香、堅果或香料等方向，再尋找更精確的詞彙。", "wheel"], ["TASTING PRACTICE", "如何品飲一杯咖啡", "Fragrance · Flavor · Body · Aftertaste", "可依序觀察乾香、濕香、入口風味、酸甜苦、醇厚度與餘韻。描述個人感受時，區分「我喜歡」與「我辨識到」兩種陳述。", "tasting"], ["PAIRING NOTES", "咖啡與甜點搭配", "Similarity · Contrast · Intensity", "可用相似風味呼應、對比平衡、強度相稱與口感互補來嘗試搭配。巧克力、堅果、莓果與柑橘甜點可作為練習起點。", "pairing"], ["COFFEE MYTHS", "咖啡常見迷思", "Look beyond one-variable explanations", "迷思一：深焙咖啡一定咖啡因較多。迷思二：crema 越厚品質越好。迷思三：日曬一定甜、水洗一定酸。這些都不能脫離豆種、配方、沖煮與評估方式直接下結論。", "myths"], ["TOOLS OF THE TRADE", "咖啡器材圖鑑", "Grinder · Dripper · Kettle · Scale", "磨豆機影響粒徑分布；濾杯與濾紙影響流速；手沖壺協助控制注水；電子秤讓粉水比與沖煮紀錄更可重現。", "tools"], ["POUR-OVER BASICS", "手沖咖啡的原理", "Gravity-driven percolation", "手沖以重力讓熱水穿過咖啡粉層。研磨、粉水比、水溫、注水與水質共同影響萃取。初學時先固定變因，再逐一調整。", "pour"], ["POUR-OVER IN SIX STEPS", "手沖六步驟", "Prepare · Rinse · Grind · Bloom · Pour · Serve", "準備水與器材、沖洗濾紙、研磨與注粉、悶蒸、分段注水、完成滴濾並輕搖均勻。每次記錄粉量、水量、時間與研磨。", "steps"], ["ESPRESSO", "義式濃縮咖啡", "Pressure · Fine grind · Short extraction", "Espresso 以加壓熱水通過細研磨咖啡粉餅。粉量、出液量、研磨、溫度、壓力與時間都會影響結果。", "espresso"], ["MILK COFFEE ATLAS", "拿鐵、卡布奇諾與 Flat White", "Milk texture changes the experience", "奶咖差異通常涉及濃縮比例、牛奶量、奶泡質地與杯量。不同咖啡館和地區可能有不同配方，不宜把名稱視為全球完全一致的規格。", "milk"], ["BREWING COMPARISON", "不同沖煮方式", "Percolation · Immersion · Pressure", "手沖偏向重力滲濾；法式濾壓壺偏向浸泡；義式濃縮使用壓力萃取。器材與方法不同，參數不宜直接互換。", "compare"], ["FRESHNESS & STORAGE", "咖啡豆保存與新鮮度", "Protect aroma from time, air, heat, and moisture", "烘焙後咖啡會隨時間釋放氣體並逐漸失去部分揮發性香氣。建議密封、避光、遠離高溫與濕氣，並依包裝建議與實際飲用速度選擇份量。", "storage"], ["BUYER'S FIELD GUIDE", "新手如何選豆？", "Start with how you like to drink", "先決定黑咖啡或奶咖，再嘗試不同烘焙與處理法。小包裝、多次記錄，比一次購買大量豆子更容易找到喜好。", "choose"], ["READ THE BAG", "看懂咖啡豆包裝", "Origin · Variety · Process · Roast date", "優先查看產地、品種、處理法、烘焙日期與烘焙程度。莊園、批次、海拔等資訊可增加追溯性，但標示完整度並非單一品質保證。", "label"], ["COFFEE GLOSSARY", "咖啡術語小字典", "A shared language for better tasting", "Acidity 酸質、Body 醇厚度、Aftertaste 餘韻、Bloom 悶蒸、Extraction 萃取、Crema 濃縮咖啡泡沫層。術語幫助溝通，不是評價高低的捷徑。", "glossary"], ["FROM CHERRY TO CUP", "一杯咖啡的旅程", "Plant · Harvest · Process · Roast · Brew", "咖啡從植物生長、採收、後製、乾燥、運輸、烘焙到沖煮，每一階段都可能改變品質與風味。", "journey"], ["YOUR COFFEE JOURNAL", "開始探索自己的咖啡世界", "Taste with curiosity. Take notes.", "記下產地、品種、處理法、烘焙、沖煮參數與自己的感受。咖啡知識最終會成為一套能幫助你選擇與分享的語言。", "end"]];let index=0;const vp=document.getElementById('viewport');function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function artFor(s,i){if(s[4]==='wheel')return '<div class="wheel"><span>FLAVOR<br>風味輪</span></div>';if(s[4]==='steps')return '<div class="steps">'+['準備與沖洗','研磨與注粉','悶蒸','分段注水','完成滴濾','記錄風味'].map((x,j)=>`<div class="step"><b>0${j+1}</b>${x}</div>`).join('')+'</div>';if(s[4]==='belt'||s[4]==='africa'||s[4]==='america'||s[4]==='asia')return '<div class="mapdots"></div>';if(i===0)return '';return `<div class="art"><img src="../01_Wiki/assets/coffee_atlas_hero.svg" alt="AI 原創復古咖啡植物與器材插畫"><div class="plate"><b>${esc(s[1])}</b><small>COFFEE ATLAS · FIELD NOTES</small></div></div>`}
function render(){vp.innerHTML=slides.map((s,i)=>{let cl=i===0?'cover':i===1?'toc':'';let content=i===1?`<div class="toclist">${slides.slice(2).map((x,j)=>`<div class="tocitem"><b>${String(j+3).padStart(2,'0')} / ${esc(x[1])}</b><small>${esc(x[0])}</small></div>`).join('')}</div>`:'';return `<section class="page ${cl}" data-page="${String(i+1).padStart(2,'0')}" id="p${i}"><div class="ornament">COFFEE ATLAS / FIELD JOURNAL</div><div class="left"><div class="kicker">${esc(s[0])}</div><h1>${esc(s[1])}</h1><h2>${esc(s[2])}</h2><p>${esc(s[3])}</p>${content}</div><div class="right">${artFor(s,i)}</div><div class="footer">THE COFFEE ATLAS · ${String(i+1).padStart(2,'0')}</div></section>`}).join('');document.getElementById('tabs').innerHTML='<div class="brand">THE COFFEE ATLAS</div>'+slides.map((s,i)=>`<button class="tab ${i===0?'active':''}" data-i="${i}" onclick="go(${i})">${String(i+1).padStart(2,'0')}<small>${esc(s[1].slice(0,4))}</small></button>`).join('');vp.addEventListener('scroll',onScroll,{passive:true});onScroll()}
function go(i){index=Math.max(0,Math.min(slides.length-1,i));document.getElementById('p'+index).scrollIntoView({behavior:'smooth'});update()}function next(){go(index+1)}function prev(){go(index-1)}function update(){document.getElementById('counter').textContent=String(index+1).padStart(2,'0')+' / '+slides.length;document.getElementById('progress').style.width=((index+1)/slides.length*100)+'%';document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===index))}function onScroll(){let i=Math.round(vp.scrollTop/window.innerHeight);if(i!==index){index=Math.max(0,Math.min(slides.length-1,i));update()}}function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();prev()}});render();
</script></body></html>
